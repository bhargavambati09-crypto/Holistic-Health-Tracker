openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: wellness
    description: Private wellness data for the signed-in user
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /wellness/snapshot:
    get:
      operationId: getWellnessSnapshot
      tags: [wellness]
      summary: Get the signed-in user's wellness data
      responses:
        "200":
          description: Current private wellness snapshot, or null before first save
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellnessSnapshotResponse"
        "401":
          description: Authentication required
    put:
      operationId: saveWellnessSnapshot
      tags: [wellness]
      summary: Save the signed-in user's wellness data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WellnessSnapshotInput"
      responses:
        "200":
          description: Saved wellness snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellnessSnapshotResponse"
        "400":
          description: Invalid snapshot
        "401":
          description: Authentication required
    delete:
      operationId: deleteWellnessSnapshot
      tags: [wellness]
      summary: Delete the signed-in user's wellness data
      responses:
        "204":
          description: Snapshot deleted
        "401":
          description: Authentication required
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WellnessSnapshotInput:
      type: object
      properties:
        payload:
          type: object
          additionalProperties: true
      required:
        - payload
    WellnessSnapshotResponse:
      type: object
      properties:
        payload:
          type: ["object", "null"]
          additionalProperties: true
        updatedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - payload
        - updatedAt

